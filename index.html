<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="" data-i18n-content="metaDescription" />
    <title data-i18n="pageTitle">haoran · 个人平台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left">
          <button
            type="button"
            class="nav-toggle"
            id="nav-toggle"
            aria-expanded="false"
            aria-controls="sidebar"
            data-i18n-aria="navToggleAria"
            aria-label="打开导航"
          >
            <span></span><span></span><span></span>
          </button>
          <a class="brand-link" href="#overview">sihaoran.cn</a>
        </div>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="zh" aria-pressed="true">
            中文
          </button>
          <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">
            EN
          </button>
        </div>
      </div>
    </header>

    <div class="shell">
      <aside class="sidebar" id="sidebar" aria-label="Sidebar">
        <nav class="side-nav" aria-label="Primary">
          <a class="side-link is-active" href="#overview" data-nav="overview" data-i18n="navOverview">
            总览
          </a>
          <div id="side-app-links"></div>
        </nav>
      </aside>

      <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

      <div class="content">
        <main>
          <section class="hero" id="overview" aria-labelledby="hero-title">
            <h1 id="hero-title" class="lede" data-i18n="heroTitle">工具与系统的统一入口。</h1>
            <div
              class="app-grid"
              id="app-list"
              role="list"
              data-i18n-aria="appsAria"
              aria-label="功能入口"
            ></div>
          </section>

          <section class="about" id="about" aria-labelledby="about-title">
            <div class="about-inner">
              <h2 id="about-title" class="about-title" data-i18n="aboutTitle">关于</h2>
              <div class="about-body" id="about-body"></div>
            </div>
          </section>
        </main>

        <footer class="site-footer">
          <p class="footer-right">
            <span data-i18n="icp">ICP 备案号待补充</span>
            <span aria-hidden="true">·</span>
            <span>© <span id="year"></span></span>
          </p>
        </footer>
      </div>
    </div>

    <script src="assets/js/main.js"></script>
  </body>
</html>
